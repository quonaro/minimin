services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    working_dir: /app
    volumes:
    - ./backend:/app
    - ./servers:/app/servers
    - ./data:/app/data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - go-bin:/go/bin
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build
    env_file:
    - backend/.env
    environment:
    - MC_SERVERS_HOST_DIR=/srv/projects/my/minecraft/minimin/servers
    ports:
    - "8081:8081"
    networks:
    - mc-agent-mesh

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    working_dir: /app/frontend
    volumes:
    - ./frontend:/app/frontend
    - pnpm-store:/root/.local/share/pnpm/store/v3
    ports:
    - "3000:3000"
    networks:
    - mc-agent-mesh
    depends_on:
    - backend

volumes:
  pnpm-store:
  go-bin:
  go-mod-cache:
  go-build-cache:


networks:
  mc-agent-mesh:
    name: mc-agent-mesh
