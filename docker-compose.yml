services:
  minimin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: MiniMin
    ports:
      - "8080:80"
    volumes:
      - ./servers:/app/servers
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ORCHESTRATOR_API_KEY=changeme
      - MC_SERVERS_HOST_DIR=/srv/projects/my/minecraft/minimin/servers
    networks:
      - mc-agent-mesh
    restart: unless-stopped

networks:
  mc-agent-mesh:
    name: mc-agent-mesh