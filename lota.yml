uuid:
  desc: Generate Minecraft offline UUID for a given player name (case-sensitive)
  args:
  - name:str
  script: |
    python3 -c "
    import hashlib, uuid
    s = 'OfflinePlayer:${name}'.encode('utf-8')
    d = hashlib.md5(s).digest()
    b = bytearray(d)
    b[6] = (b[6] & 0x0f) | 0x30
    b[8] = (b[8] & 0x3f) | 0x80
    print(uuid.UUID(bytes=bytes(b)))
    "

dev:
  desc: Start development environment
  script: docker compose up --build --force-recreate

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n "$tag" ]; then
      git tag -f "$tag"
      git push origin "$tag" --force
      git push
    else
      git push origin main
    fi 
